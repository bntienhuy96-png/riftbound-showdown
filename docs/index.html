<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#05080f">
<meta name="description" content="Showdown calculator for Riftbound: Might, effects and damage assignment for two players on one phone.">
</head>
<body><title>Riftbound Showdown Calc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Josefin+Sans:wght@500;600;700&family=Questrial&display=swap">
<style>
/* Layout: one screen (designed at 9:16, fills any wider ratio: tablet / split-screen), two player halves facing each other (top rotated 180°), gold deco seam with a Showdown gem in the middle.
   Single deliberate dark look: ink navy, thin gold geometric frames, ember (attack) vs hextech blue (defend) glows. */
:root{
  --ink:#05080f; --panel:#0a111d; --panel-2:#101a2a; --panel-3:#172338;
  --gold:#c7a362; --gold-hi:#f2d99c; --gold-lo:#5e4a29;
  --fg:#ece4d1; --muted:#8a90a3;
  --atk:#ff6a35; --atk-deep:#3a1206; --atk-glow:rgba(255,96,40,.62);
  --def:#6470ff; --def-deep:#0a0d4a; --def-glow:rgba(26,26,255,.6);
  --good:#62d996; --bad:#ff5f5f; --warn:#f1b84c;
  --font-display:"Josefin Sans","Lexend","Segoe UI",system-ui,sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.3;margin:0;overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--gold-hi);outline-offset:1px}
.num{font-family:var(--font-display);font-variant-numeric:lining-nums tabular-nums}

/* chamfered-frame primitive: gold edge layer + inset fill layer */
.cut{--c:10px;--edge:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));--fill:var(--panel);
  position:relative;background:var(--edge);
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.cut::before{content:"";position:absolute;inset:1px;background:var(--fill);
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.cut>*{position:relative;z-index:1}

.app{position:relative;height:100%;width:100%;margin:0 auto;
  display:grid;grid-template-rows:minmax(0,1fr) 64px minmax(0,1fr);background:var(--ink);overflow:hidden;container-type:inline-size}

/* Half */
.half{position:relative;min-height:0;padding:24px 20px 26px}
.half.top{transform:rotate(180deg)}
.half.atk{--c1:var(--atk);--cg:var(--atk-glow);--cd:var(--atk-deep)}
.half.def{--c1:var(--def);--cg:var(--def-glow);--cd:var(--def-deep)}
.half.neutral{--c1:var(--gold);--cg:transparent;--cd:#1a1408}
.half.neutral .frame{--edge:var(--gold);--fill:var(--ink)}
.frame{position:absolute;inset:4px 5px 5px;--c:18px;pointer-events:none;
  --edge:linear-gradient(180deg,var(--gold-lo) 0%,var(--gold) 70%,var(--gold-hi) 100%);
  /* local top = the edge touching the centre seam (top half is rotated 180°), so the glow rises from the middle for both players */
  /* one dark everywhere: frame fill = seam = outer background */
  --fill:var(--ink);
  /* edge = gold line + a bright band that sweeps across it every ~9s */
  background:linear-gradient(100deg,transparent 44%,rgba(255,246,220,.95) 50%,transparent 56%) no-repeat,var(--edge);
  background-size:260% 100%,100% 100%;background-position:160% 0,0 0;animation:sweep 20s ease-in-out infinite}
@keyframes sweep{0%,55%{background-position:160% 0,0 0}100%{background-position:-60% 0,0 0}}
/* breathing glow from the seam (separate layer so it can animate) */
.glow{position:absolute;inset:5px 6px 6px;pointer-events:none;--c:17px;
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c));
  /* one smooth multi-stop bloom from the seam: hot core → saturated hue → deep hue → panel */
  background:radial-gradient(130% 78% at 50% -4%,var(--g0) 0%,var(--g1) 20%,var(--g2) 46%,rgba(10,17,29,.0) 82%);
  transform-origin:50% 0;animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.82;transform:scaleY(.95)}50%{opacity:1;transform:scaleY(1.05)}}
.half.atk{--g0:#ffb766;--g1:#ec2c10;--g2:rgba(122,5,9,.85)}
.half.def{--g0:#c4c2ff;--g1:#1717ff;--g2:rgba(10,14,120,.85)}
/* film grain on the gradients only: grey noise in soft-light (pure black stays black),
   masked to the bloom so the dark panel never turns milky */
.glow::after,.app.res-atk::after,.app.res-def::after,.app.res-draw::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
  background-size:180px 180px;mix-blend-mode:soft-light;opacity:.55}
.glow::after{-webkit-mask-image:radial-gradient(130% 78% at 50% -4%,#000 0%,#000 35%,transparent 72%);mask-image:radial-gradient(130% 78% at 50% -4%,#000 0%,#000 35%,transparent 72%)}
.app.res-atk::after,.app.res-def::after,.app.res-draw::after{-webkit-mask-image:radial-gradient(120% 75% at 50% 50%,#000 0%,#000 50%,transparent 85%);mask-image:radial-gradient(120% 75% at 50% 50%,#000 0%,#000 50%,transparent 85%)}
.app.res-atk::after,.app.res-def::after,.app.res-draw::after{z-index:19}
.half.neutral .glow{display:none}
.frame::after{content:"";position:absolute;inset:7px;border:1px solid rgba(199,163,98,.2);z-index:1}
.orn{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:120px;height:16px;z-index:2;pointer-events:none}
.gem{position:absolute;left:50%;bottom:-1px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);
  background:var(--c1);border:1px solid var(--gold-hi);box-shadow:0 0 10px var(--c1);z-index:2;pointer-events:none}
.in{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
/* never let wide content grow the app past the screen: the single column is capped at the app width */
.app{grid-template-columns:minmax(0,1fr)}
.half,.mid{min-width:0}

/* Header */
.hd{display:flex;align-items:center;gap:8px;padding:2px 4px 0}
.hd .who{display:flex;flex-direction:column;min-width:0;gap:1px}
.hd .lab{font-family:var(--font-display);font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--c1);text-shadow:0 0 12px var(--cg)}
.hd .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .tot{margin-left:auto;font-family:var(--font-display);font-weight:900;font-size:40px;line-height:1;color:var(--c1);text-shadow:0 0 18px var(--cg)}
.hd .vs{font-size:11px;color:var(--muted);text-align:right;line-height:1.2}
.hd .vs b{font-family:var(--font-display);font-size:16px;color:var(--fg)}

.btn{height:34px;border:1px solid var(--gold-lo);border-radius:2px;background:linear-gradient(180deg,var(--panel-3),var(--panel-2));padding:0 10px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--fg)}
.btn:hover{border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{font-family:var(--font-display);font-weight:700;letter-spacing:.06em;color:var(--gold-hi)}
.btn[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);border-color:var(--gold-hi)}
.btn.sm{padding:0 8px}
.btn.del{color:var(--bad)}
.btn.yes{background:var(--bad);color:var(--ink);border-color:var(--bad)}

/* Unit grid */
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;gap:7px;padding:1px}
.grid.one{display:flex}
.grid.one>*{flex:1}
.card{--c:9px;--edge:var(--gold-lo);--fill:var(--ink);
  padding:9px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;text-align:left}
/* selected card: the same bloom stops as the half background, mirrored to rise from the card's bottom */
.card[aria-pressed="true"]{--edge:linear-gradient(180deg,var(--gold-hi),var(--g1,var(--c1)));
  --fill:radial-gradient(130% 80% at 50% 104%,var(--g0) 0%,var(--g1) 20%,var(--g2) 46%,transparent 82%),var(--ink)}
.card .m{text-shadow:none}
.card[aria-pressed="true"] .m{color:#fff;text-shadow:0 0 18px var(--c1),0 0 4px var(--c1)}
.card .n{font-size:11px;font-weight:700;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-family:var(--font-display);letter-spacing:.06em}
.card .m{font-family:var(--font-display);font-weight:900;font-size:46px;line-height:1;color:var(--fg);flex:1;display:flex;align-items:center;justify-content:center}
.grid[data-cols="3"] .card .m{font-size:38px}
.grid[data-cols="4"] .card .m{font-size:30px}
.card .m.off{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-shadow:none}
.card .mods{font-size:10.5px;color:var(--muted);line-height:1.25;min-height:13px;text-align:center;overflow-wrap:anywhere}
.mods .p{color:var(--good)} .mods .q{color:var(--bad)}
.cm{display:flex;gap:4px}
.cm button{flex:1;min-width:0;height:34px;border:1px solid var(--gold-lo);border-radius:2px;background:rgba(5,8,15,.55);font-size:20px;font-weight:700;line-height:1;color:var(--gold-hi)}
.cm button:hover{border-color:var(--gold)}
.cm button:disabled{opacity:.3;cursor:default}
.grid[data-cols="4"] .cm button{height:30px;font-size:17px}
.tk{font-family:var(--font-body);font-size:9px;font-weight:800;letter-spacing:.06em;background:var(--gold);color:var(--ink);padding:0 4px}
.tk.st{background:var(--warn)}
.tk.bk{background:#9aa3b8}
.toast{position:absolute;left:4px;right:4px;top:46px;z-index:12;display:flex;flex-direction:column;gap:4px;padding:10px 12px;
  background:rgba(20,4,6,.94);border:1px solid var(--bad);box-shadow:0 0 18px rgba(255,95,95,.35);font-size:12.5px;line-height:1.35;
  animation:toastIn .35s cubic-bezier(.34,1.5,.64,1) both}
.toast b{font-family:var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--bad);font-size:12px;padding-top:.15em}
.toast i{font-style:normal;font-weight:700;color:var(--gold-hi);margin-right:4px}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
.skull{font-family:var(--font-body);font-size:9px;font-weight:800;letter-spacing:.06em;background:var(--bad);color:var(--ink);padding:0 4px}
/* add-unit card: long multi-stop fade (side hue → complementary hue → ink) + inner deco line */
.addcard{--c:14px;--edge:linear-gradient(180deg,var(--gold-hi),var(--gold) 40%,var(--gold-lo));
  /* see-through: the half's own bloom shows inside the card, so inside and outside are one gradient */
  --fill:rgba(5,8,15,.12);
  border:0;color:var(--gold-hi);font-family:var(--font-display);font-weight:700;letter-spacing:.12em;font-size:17px;text-shadow:0 0 12px var(--c1)}
/* gold gradient outline drawn as a 1px ring (mask trick) so the inside stays see-through */
.addcard{background:var(--fill);clip-path:none}
.addcard::before{inset:0;clip-path:none;background:var(--edge);padding:1px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.addcard::after{clip-path:none}
.addcard::after{content:"";position:absolute;inset:9px;border:1px solid rgba(242,217,156,.35);pointer-events:none;z-index:1;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.addcard span{display:block;padding-top:.15em}
@keyframes fillBreathe{0%,100%{filter:brightness(.88) saturate(1)}50%{filter:brightness(1.15) saturate(1.15)}}
.card[aria-pressed="true"]::before{animation:fillBreathe 4s ease-in-out infinite}

/* Editor */
.ed{display:flex;flex-direction:column;gap:8px;padding:8px 10px;background:rgba(5,8,15,.72);border:1px solid rgba(199,163,98,.22)}
.row.add{justify-content:center}
.btn.addu{--c:8px;height:34px;padding:0 16px;border:0;--edge:linear-gradient(180deg,var(--gold-hi),var(--gold));--fill:linear-gradient(180deg,#1a1b22,#0b0d14);
  font-family:var(--font-display);font-weight:800;letter-spacing:.12em;font-size:12px;color:var(--gold-hi);border-radius:0;background:var(--edge)}
.btn.addu:hover{filter:brightness(1.2)}
.btn.addu{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.btn.addu span{display:block;line-height:1;padding-top:.2em}
.seg button{line-height:1;padding-top:.18em}
/* single compact editor row: type ▾ · −1 · +1 · Tank · Stun · Dmg stepper */
/* one compact row that fits ~330px; wraps instead of overflowing on very narrow phones */
.row.one{gap:3px;flex-wrap:wrap}
.row.one>*{flex:0 0 auto}
.row.one .typ{flex:0 0 auto;min-width:0;width:auto;padding:0 5px;font-size:11.5px;gap:3px}
.row.one .mb{min-width:28px;padding:0 3px;font-size:12.5px}
.row.one .btn.sm{padding:0 5px;font-size:11.5px}
.row.one .pre{margin-left:auto}
.row.one .pre button{width:24px}
.row.one .pv{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:28px;line-height:1;gap:1px}
.row.one .pv small{font-size:7.5px;letter-spacing:.08em;color:var(--muted)}
.row.one .pv b{font-family:var(--font-display);font-size:14px}
.half{padding:24px 16px 38px}
.ed{padding:8px}
.btn.addu.addf{position:absolute;left:50%;bottom:-29px;transform:translateX(-50%);height:24px;padding:0 14px;font-size:11px;z-index:4}
.card .n{position:relative}
.card .x{margin-left:auto;width:22px;height:22px;border:1px solid var(--gold-lo);border-radius:2px;background:rgba(5,8,15,.6);color:var(--bad);font-size:11px;line-height:1;padding:0}
/* two rows of units: tighter cards so everything fits without scrolling */
.grid[data-rows="2"]{gap:5px}
/* in two-row mode the −/+ sit either side of the number: [−] 3 [+] */
.grid[data-rows="2"] .card{padding:6px;gap:3px 2px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  grid-template-areas:"n n n" "mi m pl" "md md md";align-items:center}
.grid[data-rows="2"] .card .n{grid-area:n}
.grid[data-rows="2"] .card .m{grid-area:m;font-size:24px;padding:0 2px}
.grid[data-rows="2"] .card .mods{grid-area:md;font-size:9.5px;min-height:0}
.grid[data-rows="2"] .card .mods:empty{display:none}
.grid[data-rows="2"] .cm{display:contents}
.grid[data-rows="2"] .cm button{height:26px;font-size:15px;position:relative;z-index:1}
.grid[data-rows="2"] .cm button:first-child{grid-area:mi}
.grid[data-rows="2"] .cm button:last-child{grid-area:pl}
.grid[data-rows="2"] .card .x{width:18px;height:18px}
/* two rows: take the room from chrome (header subtitle, top padding), not from the unit cards */
.half:has(.grid[data-rows="2"]){padding-top:18px}
.in:has(.grid[data-rows="2"]) .hd .sub{display:none}
.in:has(.grid[data-rows="2"]) .hd .tot{font-size:32px}
.in:has(.grid[data-rows="2"]){gap:6px}
.grid[data-rows="2"] .dc .opp{white-space:nowrap;font-size:7.5px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grid[data-rows="2"] .dc .top{gap:4px}
.grid[data-rows="2"] .dc .bd{min-height:0}
.grid[data-rows="2"] .dc{padding:6px;gap:3px 2px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  grid-template-areas:"top top top" "bd bd bd" "mi d pl" "hp hp hp";align-items:center}
.grid[data-rows="2"] .dc .top{grid-area:top}
.grid[data-rows="2"] .dc .bd{grid-area:bd}
.grid[data-rows="2"] .dc .d{grid-area:d;padding:0 2px}
.grid[data-rows="2"] .dc .hp{grid-area:hp}
.grid[data-rows="2"] .dc .bt{display:contents}
.grid[data-rows="2"] .dc .bt button{position:relative;z-index:1}
.grid[data-rows="2"] .dc .bt button:first-child{grid-area:mi}
.grid[data-rows="2"] .dc .bt button:last-child{grid-area:pl}
.grid[data-rows="2"] .dc .d{font-size:20px}
.grid[data-rows="2"] .dc .bt button{height:26px;font-size:15px}
.row.r2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.r2 .grp{display:flex;align-items:center;gap:6px;justify-self:start}
.r2 .del{justify-self:end}
.ed{position:relative}
.typ{height:34px;flex:1 1 0;min-width:76px;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--gold-lo);border-radius:2px;background:var(--panel-2);padding:0 8px;font-size:13px;color:var(--fg)}
.typ[aria-expanded="true"]{border-color:var(--gold-hi)}
.typ span{color:var(--gold);font-size:11px}
.tpop{position:absolute;left:-1px;right:-1px;bottom:calc(100% + 6px);z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;
  background:#070b14;border:1px solid var(--gold);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 -8px 24px rgba(0,0,0,.6)}
.tpop button{height:34px;border:1px solid var(--gold-lo);border-radius:2px;background:var(--panel-2);font-size:12.5px;color:var(--fg)}
.tpop button[aria-selected="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold-hi);font-weight:600}
.row{display:flex;gap:6px;align-items:center}
.row .lbl{font-size:11px;color:var(--muted);line-height:1.15}
.row .lbl b{color:var(--fg)}
.row select{height:34px;flex:1 1 0;min-width:70px;border:1px solid var(--gold-lo);border-radius:2px;background:var(--panel-2);padding:0 6px;font-size:13px}
.mb{height:34px;min-width:40px;border:1px solid var(--gold-lo);border-radius:2px;background:var(--panel-2);font-family:var(--font-display);font-weight:800;font-size:14px}
.mb.plus{color:var(--good)} .mb.minus{color:var(--bad)}
.step{display:inline-flex;align-items:center;border:1px solid var(--gold-lo);border-radius:2px;background:var(--panel);overflow:hidden}
.step button{width:34px;height:32px;border:0;background:var(--panel-2);font-size:18px;font-weight:700;line-height:1;color:var(--gold-hi)}
.step button:disabled{opacity:.3;cursor:default}
.step output{min-width:28px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:16px}

/* Damage cards */
.dc{--c:9px;--edge:linear-gradient(180deg,var(--gold-lo),var(--gold) 85%);
  /* same bloom stops as the half, mirrored to rise from the card's bottom */
  --fill:radial-gradient(130% 80% at 50% 104%,var(--g0) 0%,var(--g1) 20%,var(--g2) 46%,transparent 82%),var(--ink);
  padding:8px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-width:0}
.dc .n{font-size:11px;font-weight:700;color:var(--muted);font-family:var(--font-display)}
.dc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.dc .opp{font-size:8.5px;font-weight:600;letter-spacing:.08em;color:var(--c1);text-align:right;line-height:1.15;opacity:.9}
.dc .bd{display:flex;gap:4px;flex-wrap:wrap;min-height:13px}
.sv{font-size:9px;font-weight:800;letter-spacing:.06em;background:var(--good);color:var(--ink);padding:0 4px}
/* opponent's units are drawn in the opponent's colour */
.half.atk .dc{--c1:var(--def)} .half.def .dc{--c1:var(--atk)}
.half .dc{--edge:linear-gradient(180deg,var(--gold-lo),var(--c1))}
.dc .d{font-family:var(--font-display);font-weight:900;font-size:30px;line-height:1;flex:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.grid[data-cols="4"] .dc .d{font-size:22px}
.dc .d small{font-size:13px;color:var(--muted);font-weight:700}
.dc .hp{height:4px;background:rgba(255,255,255,.07);overflow:hidden}
.dc .hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),#ffb36b);box-shadow:0 0 8px var(--bad)}
.dc .bt{display:flex;gap:4px}
.dc .bt button{flex:1;height:34px;border:1px solid var(--gold-lo);border-radius:2px;background:rgba(5,8,15,.55);font-weight:700;font-size:18px;color:var(--gold-hi)}
.dc .bt button:disabled{opacity:.3;cursor:default}
/* dead: same bloom, dimmed — the red edge, CHẾT tag and red number carry the state */
.dc.dead{--edge:linear-gradient(180deg,#5a1d1d,var(--bad));--fill:radial-gradient(130% 70% at 50% 104%,var(--g2) 0%,transparent 70%),var(--ink)}
.dc.dead .d{color:var(--bad)}
.msg{font-size:12px;padding:6px 8px;border-left:2px solid var(--warn);background:rgba(241,184,76,.1);color:var(--warn);font-weight:600}
.msg.ok{border-left-color:var(--good);background:rgba(98,217,150,.08);color:var(--good)}

/* Middle seam */
.mid{position:relative;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr);grid-template-rows:100%;align-items:center;padding:0 8px;
  background:var(--ink)}
/* each player's controls sit on THEIR right-hand side: .r faces the bottom player, .l is rotated for the top player */
.mid>.l{transform:rotate(180deg)}
.mid::before{content:"";position:absolute;left:0;right:0;top:50%;height:9px;transform:translateY(-50%);
  border-top:1px solid;border-bottom:1px solid;border-image:linear-gradient(90deg,transparent,var(--gold) 18%,var(--gold-hi) 50%,var(--gold) 82%,transparent) 1;pointer-events:none}
.mid>.l,.mid>.r{position:relative;display:flex;gap:6px;align-items:center}
.mid>.l{justify-content:flex-end}
.mid>.r{justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--gold-lo);background:var(--ink)}
.seg button{height:30px;border:0;background:transparent;padding:0 6px;font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.06em;color:var(--muted)}
.seg button+button{border-left:1px solid var(--gold-lo)}
.seg .rs{color:var(--gold-hi);font-size:14px;padding:0 8px}
.seg .yes{background:var(--bad);color:#fff;font-family:var(--font-body);font-size:12px;letter-spacing:0}
.seg .no{font-family:var(--font-body);font-size:12px;letter-spacing:0;color:var(--fg)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink)}
.mid .btn{height:32px;background:var(--ink)}
.mid .btn.yes{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:700}
.mid .hintline{grid-column:1 / -1;text-align:center;font-family:var(--font-display);font-weight:700;letter-spacing:.3em;font-size:11px;color:var(--gold-hi);position:relative}
.mid .hintline span{background:var(--ink);padding:0 12px}

/* Showdown gem */
.sd{position:relative;justify-self:center;width:100px;height:100px;border:0;background:none;padding:0;display:grid;place-items:center;
  /* stay on its own compositor layer, so the text isn't re-rasterised (and nudged by subpixels) when the entrance animation ends */
  will-change:transform;transform:translateZ(0);backface-visibility:hidden}
.sd .ring{position:absolute;width:76px;height:76px;transform:rotate(45deg);border:1px solid var(--gold);transition:transform .3s}
.sd .core{position:absolute;width:62px;height:62px;transform:rotate(45deg);border:1.5px solid var(--gold-hi);
  background:#0d1422;box-shadow:0 0 14px rgba(242,217,156,.35),inset 0 0 12px rgba(0,0,0,.7);animation:pulse 2.4s ease-in-out infinite}
.sd .txt{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--font-display);font-weight:800;font-size:8px;letter-spacing:.1em;color:var(--gold-hi);line-height:1}
.sd .txt .up{transform:rotate(180deg)}
.sd .txt i{display:block;width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.sd:hover .ring{transform:rotate(135deg)}
.sd:disabled{cursor:default}
.sd:disabled .core{animation:none;border-color:var(--gold)}
@keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(242,217,156,.3),inset 0 0 10px rgba(0,0,0,.6)}50%{box-shadow:0 0 26px rgba(242,217,156,.65),inset 0 0 10px rgba(0,0,0,.6)}}

/* Pick screen */
.pick{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.pick .q{font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi)}
.pick .sub{font-size:12px;color:var(--muted)}
.pk{display:flex;gap:12px;width:100%;max-width:340px}
.pk button{position:relative;flex:1;height:100px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--pc)}
.pk .pa{--pc:var(--atk);--pg:#ec2c10} .pk .pd{--pc:var(--def);--pg:#1f1fff}
.pk svg{filter:drop-shadow(0 0 4px var(--pg))!important}
.pk button:hover svg{filter:drop-shadow(0 0 9px var(--pg))!important}
.pk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px var(--pc));transition:filter .2s}
.pk svg *{vector-effect:non-scaling-stroke}
.pk .t{position:relative;font-family:var(--font-display);font-weight:900;font-size:16px;letter-spacing:.16em;padding-left:.16em;color:var(--pc);text-shadow:0 0 12px var(--pc)}
.pk .v{position:relative;font-size:11px;color:var(--muted);letter-spacing:.08em}
.pk button:hover svg{filter:drop-shadow(0 0 9px var(--pc))}

/* Resolve overlay */
/* Resolve: halves slide apart from the seam, the gem keeps rotating/scaling into a result emblem */
.app{transition:background .6s}
/* bold full-bleed result grounds: hot core behind the emblem → saturated hue → deep edge */
.app.res-atk{background:radial-gradient(120% 75% at 50% 50%,#ffc46b 0%,#ff7a1f 16%,#ef3410 34%,#c10c0f 55%,#7a0509 80%,#3a0205 100%)}
.app.res-def{background:radial-gradient(120% 75% at 50% 50%,#d6d4ff 0%,#8f8cff 12%,#1717ff 32%,#0a0fa8 52%,#14164a 76%,#141418 100%)}
.app.res-draw{background:radial-gradient(120% 75% at 50% 50%,#fff1c9 0%,#f2c46b 18%,#b8862f 40%,#5e4313 70%,#1d1406 100%)}
.ov.atk .em svg,.ov.def .em svg,.ov.draw .em svg{color:#fff;filter:drop-shadow(0 0 4px var(--oc)) drop-shadow(0 0 2px rgba(255,255,255,.6))}
.ov.atk .rg,.ov.def .rg,.ov.draw .rg{border-color:rgba(255,255,255,.85)}
/* t=0: outer gem ring scales out (ease-out) while both halves slide to their own far edge
   t=.5s: inner gem scales up to the result emblem (~50% width) · t≈1.05s: result scales in 0→100% */
.app.resolving .half{transition:transform .8s cubic-bezier(.16,1,.3,1)}
.app.resolving .half.bottom{transform:translateY(105%)}
.app.resolving .half.top{transform:rotate(180deg) translateY(105%)}
.app.resolving .mid{transition:opacity .2s;opacity:0}
.ov{position:absolute;inset:0;z-index:20;overflow:hidden;cursor:pointer;animation:ovOut .45s ease-in 3.6s forwards}
.ov.atk{--oc:var(--atk)} .ov.def{--oc:var(--def)} .ov.draw{--oc:var(--gold-hi)}
.ov .rg{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border:1.5px solid var(--oc);opacity:.6;
  box-shadow:0 0 6px var(--oc);transform:rotate(45deg);animation:rg .95s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i) * .07s)}
.ov .rg.c{box-shadow:0 0 8px var(--oc)}
.ov .em{position:absolute;left:50%;top:50%;width:50cqw;max-width:380px;aspect-ratio:1;transform:translate(-50%,-50%)}
.ov .em svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:scale(var(--s0,.3));
  animation:em .65s cubic-bezier(.16,1,.3,1) .5s forwards;color:var(--oc);filter:drop-shadow(0 0 4px var(--oc))}
.ov .em .cir,.ov .em .inner{opacity:0;animation:fadeIn .5s ease-out .85s forwards}
.ov .res{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ov .res.flip{transform:rotate(180deg)}
.ov .ri{display:flex;flex-direction:column;align-items:center;gap:6px;transform:scale(0);opacity:0;animation:resIn .55s cubic-bezier(.34,1.5,.64,1) 1.05s forwards}
.ov .rw{font-family:var(--font-display);font-weight:700;font-size:clamp(13px,4.5cqw,22px);letter-spacing:.12em;padding-left:.12em;line-height:1;padding-top:.15em;
  color:var(--oc);text-shadow:0 0 12px var(--oc)}
.ov .rl{width:22cqw;height:1px;background:linear-gradient(90deg,transparent,var(--oc),transparent)}
.ov .rs b{color:var(--fg)}
.ov .rs{font-size:clamp(9px,2.6cqw,12px);letter-spacing:.06em;color:var(--fg);text-align:center;max-width:30cqw;line-height:1.35}
.ov .rs b{color:var(--oc);font-weight:600}
.ov .skip{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;color:var(--muted);letter-spacing:.1em;opacity:0;animation:fadeIn .4s 1.5s forwards}
@keyframes fadeIn{to{opacity:1}}
/* light sweep travelling along the seam's double line, offset from the frame sweep */
.mid::after{content:"";position:absolute;left:0;right:0;top:50%;height:9px;transform:translateY(-50%);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,246,220,1),transparent) no-repeat,linear-gradient(90deg,transparent,rgba(255,246,220,1),transparent) no-repeat;
  background-size:90px 1px,90px 1px;background-position:-90px 0,calc(100% + 90px) 100%;animation:seam 14s ease-in-out 3s infinite;z-index:0}
/* controls and gem sit above the seam sweep so it passes behind them */
.mid>.l,.mid>.r,.mid>.sd{z-index:1}
@keyframes seam{0%,55%{background-position:-90px 0,calc(100% + 90px) 100%}100%{background-position:calc(100% + 90px) 0,-90px 100%}}
/* pick → unit screen: halves slide out to their edges first */
.app.leaving .half{transition:transform .4s cubic-bezier(.7,0,.84,0)}
.app.leaving .half.bottom{transform:translateY(105%)}
.app.leaving .half.top{transform:rotate(180deg) translateY(105%)}
.app.leaving .mid{transition:opacity .25s;opacity:0}
/* breathing on the result ground */
.app.res-atk,.app.res-def,.app.res-draw{background-size:100% 100%;animation:groundBreathe 3.2s ease-in-out infinite}
@keyframes groundBreathe{0%,100%{background-size:100% 100%}50%{background-size:100% 112%}}
.app.enter .half.bottom{animation:inB .85s cubic-bezier(.16,1,.3,1) both}
.app.enter .half.top{animation:inT .85s cubic-bezier(.16,1,.3,1) both}
.app.enter .mid{animation:midIn .5s ease-out .45s both}
.app.enter .mid .sd{animation:gemIn .7s cubic-bezier(.16,1,.3,1) .45s both}
@keyframes inB{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes inT{from{transform:rotate(180deg) translateY(105%)}to{transform:rotate(180deg) translateY(0)}}
@keyframes midIn{from{opacity:0}to{opacity:1}}
@keyframes gemIn{from{transform:translateZ(0) scale(0) rotate(-90deg)}to{transform:translateZ(0) scale(1) rotate(0)}}
@keyframes ovOut{to{opacity:0}}
@keyframes rg{0%{transform:rotate(45deg) scale(1);opacity:1}100%{transform:rotate(45deg) scale(var(--s,14));opacity:0}}
@keyframes em{to{transform:scale(1)}}
@keyframes resIn{to{transform:scale(1);opacity:1}}
/* The resolve sequence is the feature the user asked for, so it plays even with the OS "reduce motion" setting; only the idle pulse stops. */
@media (prefers-reduced-motion:reduce){
  .sd .core{animation:none}
}

/* ================= MODERN THEME (class .min) =================
   Soft-UI, no gradients: one warm light-grey surface, depth only from paired light/dark shadows
   (raised / inset), pill controls, black pills for "on" and primary actions, big light geometric type.
   Side colour appears only as flat solid accents (labels, small dots, the selected edge). */
html.min-page,html.min-page body{background:#e9e8e5}
.app.min{color-scheme:light;
  --ink:#e9e8e5; --panel:#e9e8e5; --panel-2:#e3e2df; --panel-3:#dcdbd7; --line:rgba(0,0,0,.06);
  --gold:#cfcdc8; --gold-lo:#d6d4cf; --gold-hi:#1d1d20;
  --fg:#1d1d20; --muted:#8b8a8f;
  --atk:#ff7a2f; --def:#5c6cff;
  --good:#3c9a68; --bad:#e2554a; --warn:#c08a26;
  --font-display:"Questrial","Lexend","Segoe UI",system-ui,sans-serif;
  --raise:7px 7px 16px rgba(160,157,151,.55),-7px -7px 16px rgba(255,255,255,.95);
  --raise-s:4px 4px 9px rgba(160,157,151,.5),-4px -4px 9px rgba(255,255,255,.95);
  --inset:inset 4px 4px 9px rgba(160,157,151,.5),inset -4px -4px 9px rgba(255,255,255,.9);
  background:var(--ink);color:var(--fg)}
/* surfaces: flat, no chamfers, no deco, no colour fields */
.app.min .cut{clip-path:none;background:var(--panel)}
.app.min .cut::before,.app.min .frame::after,.app.min .orn,.app.min .glow,.app.min .mid::before,.app.min .mid::after{display:none}
.app.min .frame{inset:8px;border-radius:34px;animation:none;background:var(--panel);box-shadow:var(--raise)}
.app.min .half{padding:24px 18px 40px}
.app.min .mid{background:transparent}
/* type */
.app.min .hd .lab{font-family:var(--font-body);font-weight:500;font-size:11px;letter-spacing:.16em;text-shadow:none}
.app.min .hd .lab::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c1);margin-right:7px;vertical-align:1px}
.app.min .hd .sub{color:var(--muted)}
.app.min .hd .tot{font-weight:400;font-size:46px;color:var(--fg);text-shadow:none;letter-spacing:-.02em}
.app.min .hd .vs b{font-weight:400}
/* pills */
.app.min .btn,.app.min .typ,.app.min .mb,.app.min .cm button,.app.min .dc .bt button,.app.min .step{border:0;border-radius:999px;background:var(--panel);box-shadow:var(--raise-s);color:var(--fg)}
.app.min .step{overflow:visible} .app.min .step button,.app.min .row.one .pre button{background:transparent;box-shadow:none;color:var(--fg)}
.app.min .btn[aria-pressed="true"],.app.min .seg button[aria-pressed="true"]{background:var(--on-bg);color:var(--on-fg);box-shadow:3px 3px 8px rgba(0,0,0,.25)}
.app.min .btn:disabled,.app.min .cm button:disabled,.app.min .dc .bt button:disabled{box-shadow:none;opacity:.35}
.app.min .mb.plus{color:var(--good)} .app.min .mb.minus{color:var(--bad)}
.app.min .typ span{color:var(--muted)}
.app.min .row.one{gap:4px}
.app.min .ed{background:var(--panel);border:0;border-radius:26px;box-shadow:var(--inset);padding:8px}
.app.min .tpop{background:var(--panel-2);border:0;border-radius:22px;box-shadow:0 18px 40px rgba(60,58,54,.22);padding:8px;gap:6px}
.app.min .tpop button{border:0;border-radius:999px;background:var(--panel);box-shadow:var(--raise-s)}
.app.min .tpop button[aria-selected="true"]{background:var(--on-bg);color:var(--on-fg)}
.app.min .seg{border:0;border-radius:999px;background:var(--panel);box-shadow:var(--inset);padding:3px;gap:2px}
.app.min .seg button{border-radius:999px;color:var(--muted);font-family:var(--font-body);font-weight:500;letter-spacing:.04em;padding:0 10px;height:28px}
.app.min .seg button+button{border-left:0}
.app.min .seg .rs{color:var(--fg)}
.app.min .seg .yes{background:var(--bad);color:var(--on-fg)}
/* showdown button: black circle */
.app.min .sd .ring{display:none}
.app.min .sd .core{width:66px;height:66px;border-radius:50%;transform:none;border:0;background:var(--on-bg);animation:none;box-shadow:6px 6px 14px rgba(0,0,0,.28),-5px -5px 12px rgba(255,255,255,.9)}
.app.min .sd:disabled .core{background:var(--on-bg);opacity:.9}
.app.min .sd .txt{color:var(--on-fg);font-family:var(--font-body);font-weight:500;font-size:7px;letter-spacing:.12em}
.app.min .sd .txt i{background:rgba(255,255,255,.35);width:28px}
/* add buttons */
.app.min .btn.addu.addf{background:var(--on-bg);color:var(--on-fg);border-radius:999px;box-shadow:4px 4px 10px rgba(0,0,0,.22);font-family:var(--font-body);font-weight:500;letter-spacing:.06em}
.app.min .addcard{background:var(--panel);border:0;border-radius:28px;box-shadow:var(--inset);color:var(--muted);text-shadow:none;font-family:var(--font-display);font-weight:400;letter-spacing:.02em;font-size:20px}
.app.min .addcard::after{display:none}
/* unit cards: raised tiles; the selected one turns into a black card */
.app.min .card,.app.min .dc{border-radius:24px;background:var(--panel);box-shadow:var(--raise-s)}
.app.min .card .m{color:var(--fg);font-weight:400}
.app.min .card[aria-pressed="true"]{background:var(--on-bg);box-shadow:6px 6px 16px rgba(0,0,0,.28)}
.app.min .card[aria-pressed="true"]::before{display:none}
.app.min .card[aria-pressed="true"] .m{color:var(--on-fg);text-shadow:none}
.app.min .card[aria-pressed="true"] .n,.app.min .card[aria-pressed="true"] .mods{color:var(--on-muted)}
.app.min .card[aria-pressed="true"] .cm button{background:var(--on-2);box-shadow:none;color:var(--on-fg)}
.app.min .card[aria-pressed="true"] .x{background:var(--on-2);color:#ff8a80}
.app.min .card .n,.app.min .dc .n{color:var(--muted);font-weight:500}
.app.min .card .x{border:0;border-radius:50%;background:var(--panel);box-shadow:var(--raise-s)}
.app.min .tk,.app.min .skull,.app.min .sv{border-radius:999px;font-weight:600;padding:1px 6px}
.app.min .tk{background:var(--on-bg);color:var(--on-fg)}
.app.min .tk.st{background:#f1dfb9;color:#7c5a17} .app.min .tk.bk{background:#d9dcf3;color:#3d4687}
.app.min .skull{background:#f6d6d2;color:#b53c32} .app.min .sv{background:#d4ecdd;color:#2f7a52}
/* damage cards */
.app.min .dc .d{color:var(--fg);font-weight:400}
.app.min .dc.dead{background:#efe4e2;box-shadow:var(--inset)}
.app.min .dc.dead .d{color:var(--bad)}
.app.min .dc .opp{color:var(--c1)}
.app.min .dc .hp{background:var(--panel);box-shadow:inset 2px 2px 4px rgba(160,157,151,.5),inset -2px -2px 4px rgba(255,255,255,.9);border-radius:99px;height:6px}
.app.min .dc .hp i{background:var(--bad);box-shadow:none;border-radius:99px}
.app.min .msg{border:0;border-radius:999px;background:var(--panel);box-shadow:var(--inset);color:#8a6420;padding:7px 14px}
.app.min .msg.ok{color:#2f7a52}
.app.min .toast{background:var(--panel-2);color:var(--fg);border:0;border-radius:24px;box-shadow:0 18px 40px rgba(60,58,54,.25)}
.app.min .toast b{font-family:var(--font-body);font-weight:600;letter-spacing:.06em;color:var(--bad)}
.app.min .toast i{color:var(--fg)}
/* side-pick: raised tiles with a small solid side dot */
.app.min .pick{gap:22px}
.app.min .pick .q{font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:0;text-transform:none;color:var(--fg)}
.app.min .pk{gap:16px}
.app.min .pk svg{display:none}
.app.min .pk button{position:relative;height:112px;border-radius:30px;background:var(--panel);box-shadow:var(--raise);transition:box-shadow .2s,transform .2s;align-items:flex-start;padding:0 18px}
.app.min .pk button::before{content:"";position:absolute;right:18px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--pc)}
.app.min .pk button:hover{transform:translateY(-1px)}
.app.min .pk button:active{box-shadow:var(--inset)}
.app.min .pk .t{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.01em;padding-left:0;color:var(--fg);text-shadow:none}
.app.min .pk .v{font-size:12px}
.app.min .pick .sub{color:var(--muted)}
/* result scene: flat — raised card with the result, solid ripples, no orb/gradient */
.app.min.res-atk,.app.min.res-def,.app.min.res-draw{background:var(--ink);animation:none}
.app.min.res-atk::after,.app.min.res-def::after,.app.min.res-draw::after{display:none}
.app.min .ov.atk{--oc:#ff7a2f} .app.min .ov.def{--oc:#5c6cff} .app.min .ov.draw{--oc:#9a98a0}
.app.min .ov .rg{border-radius:50%;border:1.5px solid var(--oc);box-shadow:none;opacity:.4}
.app.min .ov .em svg,.app.min .ov .orb{display:none}
.app.min .ov .res{z-index:1}
.app.min .ov .ri{background:var(--panel);border-radius:32px;padding:22px 28px;box-shadow:var(--raise)}
.app.min .ov .rw{font-family:var(--font-display);font-weight:400;font-size:clamp(20px,7cqw,32px);letter-spacing:.04em;padding:0;color:var(--fg);text-shadow:none}
.app.min .ov .rw::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--oc);margin-right:10px;vertical-align:4px}
.app.min .ov .rl{background:var(--fg);opacity:.12;width:40px}
.app.min .ov .rs{color:var(--muted);max-width:none}
.app.min .ov .rs b{color:var(--fg)}
.app.min .ov .skip{color:var(--muted)}
.app.min .seg.theme button{padding:0 10px}
.app.min .in:has(.grid[data-rows="2"]) .hd .tot{font-size:34px}
.app.min .grid[data-rows="2"] .card,.app.min .grid[data-rows="2"] .dc{border-radius:18px}
/* "on" colours (black pill in light, light pill in dark) */
.app.min{--on-bg:#1d1d20;--on-fg:#fff;--on-2:#2c2c30;--on-muted:#b9b8bd}
/* ---- Modern · dark: same soft-UI, charcoal surface, shadows from black + faint white ---- */
html.min-page.dark-page,html.min-page.dark-page body{background:#232428}
.app.min.dark{color-scheme:dark;
  --ink:#232428; --panel:#232428; --panel-2:#2b2c31; --panel-3:#323339; --line:rgba(255,255,255,.06);
  --fg:#ececef; --muted:#8e8f96; --gold-hi:#ececef;
  --atk:#ff8a4a; --def:#7d8bff; --good:#6fd39b; --bad:#ff7b70; --warn:#e8b65a;
  --raise:7px 7px 16px rgba(0,0,0,.55),-6px -6px 14px rgba(255,255,255,.045);
  --raise-s:4px 4px 9px rgba(0,0,0,.5),-3px -3px 8px rgba(255,255,255,.045);
  --inset:inset 4px 4px 9px rgba(0,0,0,.5),inset -3px -3px 8px rgba(255,255,255,.04);
  --on-bg:#ececef;--on-fg:#1d1d20;--on-2:#d4d4d8;--on-muted:#5b5b62}
.app.min.dark .tk.st{background:#4a3c1f;color:#f1d38f} .app.min.dark .tk.bk{background:#2f3352;color:#c3c9ff}
.app.min.dark .skull{background:#4d2523;color:#ffb3ad} .app.min.dark .sv{background:#21402f;color:#9fe3bb}
.app.min.dark .dc.dead{background:#33282a}
.app.min.dark .msg{color:#e8c47a} .app.min.dark .msg.ok{color:#8fdcae}
.app.min.dark .card[aria-pressed="true"] .x{color:#c4372d}
.app.min.dark .seg .yes{background:var(--bad);color:#1d1d20}
/* empty state in the damage tab (opponent placed no units) */
.empty-st{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;color:var(--muted)}
.empty-st b{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);padding-top:.15em}
.empty-st span{font-size:12.5px}
.empty-st .es-ico{color:var(--gold);line-height:0;margin-bottom:2px}
.app.min .empty-st b{font-weight:400;font-size:19px;letter-spacing:0;text-transform:none}
.app.min .empty-st .es-ico{color:var(--muted)}
.pick .opts{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.app.min .pick{gap:16px}
/* language switch: works in every theme */
.seg.lang{display:inline-flex;border:1px solid var(--gold-lo);background:var(--ink)}
.seg.lang button{height:28px;padding:0 10px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--muted);border:0;background:transparent}
.seg.lang button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink)}
.app.min .seg.lang{border:0;background:var(--panel)}
.app.min .seg.lang button[aria-pressed="true"]{background:var(--on-bg);color:var(--on-fg)}
/* light / dark switch on the side-pick screen (Modern only) */
.seg.mode{display:inline-flex}
.seg.mode button{display:inline-flex;align-items:center;gap:5px}
/* Showdown button in Modern: soft raised circle like the Tank / B-line pills, swords icon instead of the word */
.sd .ico{display:none;position:relative;line-height:0}
.app.min .sd .core{width:64px;height:64px;border-radius:50%;background:var(--panel);box-shadow:var(--raise);border:0;opacity:1}
.app.min .sd:disabled .core{background:var(--panel);opacity:1}
.app.min .sd:not(:disabled):active .core{box-shadow:var(--inset)}
.app.min .sd .txt{display:none}
.app.min .sd .ico{display:block;color:var(--fg)}
.app.min .sd:disabled .ico{color:var(--muted)}
/* the unit grid scrolls (overflow:auto), which clipped the soft shadows into hard edges:
   give the shadows room inside the scroll box, and pull the box out by the same amount so layout is unchanged */
.app.min .grid{padding:16px;margin:-16px}
/* legacy never shows the orb */
.ov .orb{display:none;position:absolute;inset:-18%;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#fff 0%,var(--oc2,#fff) 18%,var(--oc) 52%,transparent 72%);filter:blur(14px);
  transform:scale(var(--s0,.3));animation:em .8s cubic-bezier(.16,1,.3,1) .5s forwards}
</style>

<div class="app" id="app"></div>

<script>
const TYPES=[
  {k:'buff',label:'Buff'},{k:'gear',label:'Gear'},{k:'reaction',label:'Reaction'},
  {k:'spell',label:'Spell / Action'},{k:'assault',label:'Assault',only:'atk'},
  {k:'shield',label:'Shield',only:'def'},{k:'other',label:'Khác'}];
/* effect labels: game terms stay English; only "Other" is translated (read at render time) */
const LABEL=new Proxy(Object.fromEntries(TYPES.map(t=>[t.k,t.label])),{get:(o,k)=>k==='other'?T('other'):o[k]});
const SIDE={atk:'Attacker',def:'Defender'};
const OPP={atk:'def',def:'atk'};
const COLOR={atk:'var(--atk)',def:'var(--def)'};
const KEY='rb-showdown-v3';
const MAXU=8;
let uid=1;
const mkUnit=(base=2,tank=false,mods={},o={})=>({id:'u'+(uid++),base,tank,mods,stun:!!o.stun,pre:o.pre||0});
function blank(){
  return {phase:'pick',bottom:'atk',sel:{atk:null,def:null},sides:{atk:[],def:[]},dmg:{atk:{},def:{}},type:{atk:'buff',def:'buff'}};
}
let S=null;
try{const raw=localStorage.getItem(KEY); if(raw){S=JSON.parse(raw); uid=1+Math.max(0,...['atk','def'].flatMap(s=>S.sides[s].map(u=>+u.id.slice(1))));}}catch(e){S=null}
if(!S||!S.sides) S=blank();
if(!S.bottom) S.bottom='atk';
let confirmReset=false, resolving=false, openType=null;
/* visual theme, kept apart from the showdown state so "new showdown" never resets it */
let THEME='legacy';
try{THEME=localStorage.getItem('rb-theme')==='minimal'?'minimal':'legacy';}catch(e){}
const setTheme=t=>{THEME=t; try{localStorage.setItem('rb-theme',t)}catch(e){}};
/* light / dark, only offered for the Modern theme */
let MODE='light';
try{MODE=localStorage.getItem('rb-mode')==='dark'?'dark':'light';}catch(e){}
const setMode=m=>{MODE=m; try{localStorage.setItem('rb-mode',m)}catch(e){}};
/* ---------- Language (EN / VI) ----------
   Game terms (Might, Tank, B-line, Stun, Buff, Showdown…) stay in English in both languages, as on the cards. */
let LANG='en';
try{const v=localStorage.getItem('rb-lang'); LANG=v==='vi'||v==='en'?v:((navigator.language||'').toLowerCase().startsWith('vi')?'vi':'en');}catch(e){}
const setLang=l=>{LANG=l; try{localStorage.setItem('rb-lang',l)}catch(e){}};
const STR={
  vi:{other:'Khác',errTank:'Unit Tank chưa được gán đủ damage trước.',errBline:'Unit B-line phải được gán damage sau cùng.',
    errLethal:'Gây đủ lethal 1 unit rồi mới chia sang unit khác.',errLeft:n=>`Còn ${n} damage chưa chia.`,cant:'Chưa thể Showdown',
    dec:'Giảm',inc:'Tăng',del:'Xoá unit',decM:'Giảm Might gốc',incM:'Tăng Might gốc',eff:'Loại hiệu ứng',
    blTitle:'B-line (Backline): phải được gán damage sau cùng',stTitle:'Unit bị stun không gây combat damage',pre:'Damage đã nhận từ trước',
    subStun:ms=>` · Might ${ms}, trừ stun/chết`,subTap:' · chạm unit để gắn hiệu ứng',opp:'đối thủ',addBig:'+ THÊM UNIT',
    oppUnit:'UNIT ĐỐI PHƯƠNG',dead:'CHẾT',alive:'SỐNG SÓT',deadPre:'Chết trước combat',lessD:'Bớt damage',moreD:'Thêm damage',
    ok:'Chia damage hợp lệ.',dmgSub:(a,n)=>`Chia damage · units của bạn ${a}/${n} sống`,left:'còn lại',noOpp:'Đối thủ không có unit.',noOppSub:n=>n?`${n} damage của bạn không có mục tiêu.`:'Không có gì để chia.',
    auto:'Tự chia',q:'Bạn là bên nào?',atkV:'Tấn công',defV:'Phòng thủ',one:'Chỉ cần một người chọn',
    modeL:'Chế độ sáng tối',light:'Sáng',dark:'Tối',langL:'Ngôn ngữ',clear:'Xoá trận',cancel:'Huỷ',newM:'Trận mới',
    liv:'sống',skip:'Chạm để bỏ qua',theme:'Theme'},
  en:{other:'Other',errTank:'Tank units must be assigned lethal damage first.',errBline:'B-line units must be assigned damage last.',
    errLethal:'Assign lethal damage to one unit before moving to the next.',errLeft:n=>`${n} damage still unassigned.`,cant:"Can't Showdown yet",
    dec:'Decrease',inc:'Increase',del:'Remove unit',decM:'Decrease base Might',incM:'Increase base Might',eff:'Effect type',
    blTitle:'B-line (Backline): assigned damage last',stTitle:'Stunned units deal no combat damage',pre:'Damage already taken',
    subStun:ms=>` · Might ${ms}, minus stunned/dead`,subTap:' · tap a unit to add effects',opp:'opponent',addBig:'+ ADD UNIT',
    oppUnit:'OPPONENT UNIT',dead:'DEAD',alive:'ALIVE',deadPre:'Died before combat',lessD:'Less damage',moreD:'More damage',
    ok:'Damage split is valid.',dmgSub:(a,n)=>`Assign damage · your units ${a}/${n} alive`,left:'left',noOpp:'Opponent has no units.',noOppSub:n=>n?`Your ${n} damage has no target.`:'Nothing to assign.',
    auto:'Auto',q:'Which side are you?',atkV:'Attacking',defV:'Defending',one:'Only one player needs to pick',
    modeL:'Light or dark',light:'Light',dark:'Dark',langL:'Language',clear:'Clear',cancel:'Cancel',newM:'New showdown',
    liv:'alive',skip:'Tap to skip',theme:'Theme'}
};
const T=(k,...a)=>{const v=(STR[LANG]||STR.en)[k]; return typeof v==='function'?v(...a):v;};
if(S.type.atk==='shield') S.type.atk='buff'; if(S.type.def==='assault') S.type.def='buff';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const modSum=u=>Object.values(u.mods).reduce((a,b)=>a+b,0);
const might=u=>Math.max(0,u.base+modSum(u));
const lethal=u=>Math.max(1,might(u));
const preOf=u=>u.pre||0;
const preDead=u=>preOf(u)>=lethal(u);              // died before combat (spell damage / Might reduced)
const left0=u=>Math.max(0,lethal(u)-preOf(u));      // lethal still needed in combat
const dealt=u=>(u.stun||preDead(u))?0:might(u);     // stunned or dead units deal no combat damage
const total=s=>S.sides[s].reduce((a,u)=>a+dealt(u),0);
const mightSum=s=>S.sides[s].reduce((a,u)=>a+might(u),0);
const idx=(s,u)=>S.sides[s].indexOf(u)+1;
const find=id=>{for(const s of ['atk','def']){const u=S.sides[s].find(x=>x.id===id); if(u) return [s,u];} return [];};
const fmt=n=>(n>0?'+':'−')+Math.abs(n);

/* Damage: S.dmg[r][id] = damage received by unit id on side r (dealt by OPP[r]) */
const dmgOf=(r,u)=>S.dmg[r][u.id]||0;
const isDead=(r,u)=>preDead(u)||dmgOf(r,u)>=left0(u);
const targets=r=>S.sides[r].filter(u=>!preDead(u));
function clampDmg(){
  for(const r of ['atk','def']){
    const ok=new Set(targets(r).map(u=>u.id));
    for(const id in S.dmg[r]) if(!ok.has(id)) delete S.dmg[r][id];
    let pool=total(OPP[r]);
    for(const u of targets(r)){const d=Math.min(dmgOf(r,u),pool); S.dmg[r][u.id]=d; pool-=d;}
  }
}
function autoAssign(r){
  let pool=total(OPP[r]);
  /* assignment order: Tank first → normal units → Backline last */
  const rank=u=>u.tank?0:u.backline?2:1;
  const list=[...targets(r)].sort((a,b)=>rank(a)-rank(b));
  S.dmg[r]={};
  for(const u of list){const d=Math.min(left0(u),pool); S.dmg[r][u.id]=d; pool-=d;}
  if(pool>0&&list.length) S.dmg[r][list[list.length-1].id]+=pool;
}
function checks(r){
  const list=targets(r), pool=total(OPP[r]);
  const left=pool-list.reduce((a,u)=>a+dmgOf(r,u),0);
  const w=[];
  const tanks=list.filter(u=>u.tank&&!isDead(r,u));
  if(tanks.length&&list.some(u=>!u.tank&&dmgOf(r,u)>0)) w.push(T('errTank'));
  const frontOpen=list.filter(u=>!u.backline&&!isDead(r,u));
  if(frontOpen.length&&list.some(u=>u.backline&&!u.tank&&dmgOf(r,u)>0)) w.push(T('errBline'));
  if(list.filter(u=>{const d=dmgOf(r,u);return d>0&&d<left0(u);}).length>1) w.push(T('errLethal'));
  if(left>0&&list.some(u=>!isDead(r,u))) w.push(T('errLeft',left));
  return {pool,left,w};
}

/* ---------- Views ---------- */
const ORN=`<svg class="orn" viewBox="0 0 120 16" aria-hidden="true"><path d="M0 1H44L60 13L76 1H120" fill="none" stroke="var(--gold)" stroke-width="1"/><path d="M50 1L60 8.5L70 1" fill="none" stroke="var(--gold-hi)" stroke-width="1"/><rect x="57" y="10" width="6" height="6" transform="rotate(45 60 13)" fill="var(--gold-hi)"/></svg>`;
/* blocking error shown in BOTH halves when Showdown is pressed with an illegal damage split */
let errs=null, errTimer=0;
function toast(){
  if(!errs) return '';
  return `<div class="toast" role="alert"><b>${T('cant')}</b>${errs.map(e=>`<span><i>${e.side}</i> ${e.msg}</span>`).join('')}</div>`;
}
function showErrs(list){
  errs=list; render(); clearTimeout(errTimer);
  errTimer=setTimeout(()=>{errs=null; render();},3800);
}
function shell(cls,inner){
  return `<section class="half ${cls}"><div class="frame cut"></div><div class="glow"></div>${ORN}<div class="in">${inner}${toast()}</div></section>`;
}
function stepper(a,s,val,min,max){
  return `<span class="step"><button type="button" data-a="${a}" data-s="${s}" data-d="-1" ${val<=min?'disabled':''} aria-label="${T('dec')}">−</button><output>${val}</output><button type="button" data-a="${a}" data-s="${s}" data-d="1" ${val>=max?'disabled':''} aria-label="${T('inc')}">+</button></span>`;
}
function modLine(u){
  const m=Object.entries(u.mods).filter(([,v])=>v);
  const parts=m.map(([k,v])=>`<span class="${v>0?'p':'q'}">${fmt(v)}</span> ${LABEL[k]}`);
  if(preOf(u)) parts.push(`<span class="q">${preOf(u)} dmg</span>`);
  return parts.join(' · ');
}
function badges(u){
  return (u.tank?'<span class="tk">TANK</span>':'')+(u.backline?'<span class="tk bk">B-LINE</span>':'')+(u.stun?'<span class="tk st">STUN</span>':'')+(preDead(u)?`<span class="skull">${T('dead')}</span>`:'');
}
/* 1–2 units: 2 cols · 3: 3 · 4: 4 · 5+: two rows */
function gridStyle(n){
  const c=n<=2?2:n<=4?n:Math.ceil(n/2), r=n<=4?1:2;
  return `style="grid-template-columns:repeat(${c},minmax(0,1fr));grid-template-rows:repeat(${r},minmax(min-content,1fr))" data-cols="${c}" data-rows="${r}"`;
}
/* + UNIT floats at the bottom-centre of each half, sitting on the frame edge, so it costs no layout height */
const addBtn=s=>S.sides[s].length<MAXU?`<button type="button" class="btn addu addf cut" data-a="add" data-s="${s}"><span>+ UNIT</span></button>`:'';
function halfMight(s){
  const L=S.sides[s]; const sel=L.find(u=>u.id===S.sel[s]);
  const cards=L.map(u=>`<div class="card cut" role="button" tabindex="0" data-a="sel" data-s="${s}" data-id="${u.id}" aria-pressed="${u===sel}">
      <span class="n">#${idx(s,u)}${badges(u)}${u===sel?`<button type="button" class="x" data-a="del" data-s="${s}" aria-label="${T('del')} #${idx(s,u)}">✕</button>`:''}</span>
      <span class="m${u.stun||preDead(u)?' off':''}">${might(u)}</span>
      <span class="mods">${modLine(u)}</span>
      <span class="cm"><button type="button" data-a="cbase" data-s="${s}" data-id="${u.id}" data-d="-1" ${u.base<=0?'disabled':''} aria-label="${T('decM')}">−</button><button type="button" data-a="cbase" data-s="${s}" data-id="${u.id}" data-d="1" aria-label="${T('incM')}">+</button></span></div>`).join('');
  /* custom picker instead of <select>: native dropdowns ignore the 180° rotation of the top half */
  const pop=openType===s?`<div class="tpop" role="listbox" aria-label="${T('eff')}">${TYPES.filter(t=>!t.only||t.only===s).map(t=>`<button type="button" role="option" aria-selected="${S.type[s]===t.k}" data-a="typeset" data-s="${s}" data-k="${t.k}">${LABEL[t.k]}</button>`).join('')}</div>`:'';
  const ed=sel?`${pop}<div class="row one">
        <button type="button" class="typ" data-a="typeopen" data-s="${s}" aria-expanded="${openType===s}" aria-label="${T('eff')}">${LABEL[S.type[s]]||'Buff'}<span aria-hidden="true">▾</span></button>
        <button type="button" class="mb minus" data-a="mod" data-s="${s}" data-d="-1">−1</button>
        <button type="button" class="mb plus" data-a="mod" data-s="${s}" data-d="1">+1</button>
        <button type="button" class="btn sm" data-a="tank" data-s="${s}" aria-pressed="${sel.tank}">Tank</button>
        <button type="button" class="btn sm" data-a="back" data-s="${s}" aria-pressed="${!!sel.backline}" title="${T('blTitle')}">B-line</button>
        <button type="button" class="btn sm" data-a="stun" data-s="${s}" aria-pressed="${!!sel.stun}" title="${T('stTitle')}">Stun</button>
        <span class="pre step" role="group" aria-label="${T('pre')}"><button type="button" data-a="pre" data-s="${s}" data-d="-1" ${preOf(sel)<=0?'disabled':''} aria-label="${T('dec')}">−</button><span class="pv"><small>DMG</small><b>${preOf(sel)}</b></span><button type="button" data-a="pre" data-s="${s}" data-d="1" aria-label="${T('inc')}">+</button></span></div>`
    :'';
  const ms=mightSum(s),t=total(s);
  return `<div class="hd"><div class="who"><span class="lab">${SIDE[s].toUpperCase()}</span><span class="sub">${L.length} unit${ms!==t?T('subStun',ms):L.length?T('subTap'):''}</span></div>
      <span class="tot num">${t}</span><span class="vs">${T('opp')}<br><b>${total(OPP[s])}</b></span></div>
    ${L.length?`<div class="grid" ${gridStyle(L.length)}>${cards}</div>`:`<div class="grid one"><button type="button" class="addcard cut" data-a="add" data-s="${s}"><span>${T('addBig')}</span></button></div>`}
    ${ed?`<div class="ed">${ed}</div>`:''}
    ${L.length?addBtn(s):''}`;
}
function halfDmg(s){
  const r=OPP[s], c=checks(r), E=S.sides[r];
  const mine=S.sides[s], alive=mine.filter(u=>!isDead(s,u)).length;
  const cards=E.map(u=>{
    const top=`<span class="top"><span class="n">#${idx(r,u)}</span><span class="opp">${T('oppUnit')}</span></span>`;
    if(preDead(u)) return `<div class="dc cut dead">${top}<span class="bd"><span class="skull">${T('dead')}</span></span>
      <span class="d"><small>${T('deadPre')}</small></span><span class="hp"><i style="width:100%"></i></span></div>`;
    const d=dmgOf(r,u),L=left0(u),dead=d>=L;
    return `<div class="dc cut${dead?' dead':''}">${top}<span class="bd">${u.tank?'<span class="tk">TANK</span>':''}${u.backline?'<span class="tk bk">B-LINE</span>':''}${u.stun?'<span class="tk st">STUN</span>':''}${dead?`<span class="skull">${T('dead')}</span>`:`<span class="sv">${T('alive')}</span>`}</span>
      <span class="d num">${d}<small>/${L}${preOf(u)?` (+${preOf(u)})`:''}</small></span><span class="hp"><i style="width:${Math.min(100,d/L*100)}%"></i></span>
      <span class="bt"><button type="button" data-a="dmg" data-s="${r}" data-id="${u.id}" data-d="-1" ${d<=0?'disabled':''} aria-label="${T('lessD')}">−</button><button type="button" data-a="dmg" data-s="${r}" data-id="${u.id}" data-d="1" ${c.left<=0?'disabled':''} aria-label="${T('moreD')}">+</button></span></div>`;}).join('');
  const msg=targets(r).length?(c.w.length?`<div class="msg">${c.w[0]}</div>`:`<div class="msg ok">${T('ok')}</div>`):'';
  return `<div class="hd"><div class="who"><span class="lab">${SIDE[s].toUpperCase()}</span><span class="sub">${T('dmgSub',alive,mine.length)}</span></div>
      <span class="tot num">${c.left}</span><span class="vs">${T('left')}<br>/ <b>${c.pool}</b></span></div>
    ${E.length
      ?`<div class="grid" ${gridStyle(E.length)}>${cards}</div>
        <div class="row">${msg?`<div style="flex:1;min-width:0">${msg}</div>`:'<div style="flex:1"></div>'}<button type="button" class="btn" data-a="auto" data-s="${r}">${T('auto')}</button></div>`
      /* empty state: nothing to assign, so no controls — just say so, quietly, in the middle */
      :`<div class="empty-st"><span class="es-ico" aria-hidden="true">${ICON.empty}</span><b>${T('noOpp')}</b><span>${T('noOppSub',c.pool)}</span></div>`}`;
}
/* art-deco line frame for the side buttons. Lines only (no fill); the stroke itself carries the
   same ramp as the side's bloom: deep hue at the top → saturated hue → hot core at the bottom */
const RAMP={atk:['#b8180c','#ec2c10','#ffb766'],def:['#2424c8','#1f1fff','#c4c2ff']};
const deco=(id,side)=>DECO_T.replace(/__ID__/g,id).replace('__G__',
  `<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100"><stop offset="0" stop-color="${RAMP[side][0]}"/><stop offset=".55" stop-color="${RAMP[side][1]}"/><stop offset="1" stop-color="${RAMP[side][2]}"/></linearGradient></defs>`);
const DECO_T=`<svg viewBox="0 0 160 100" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="url(#__ID__)">__G__
  <polygon points="12,0 148,0 160,12 160,88 148,100 12,100 0,88 0,12" stroke-width="1.5"/>
  <polygon points="16,6 144,6 154,16 154,84 144,94 16,94 6,84 6,16" stroke-width="1" opacity=".45"/>
  <polyline points="60,6 80,18 100,6" stroke-width="1"/><polyline points="68,6 80,13 92,6" stroke-width="1" opacity=".6"/>
  <polyline points="60,94 80,82 100,94" stroke-width="1"/><polyline points="68,94 80,87 92,94" stroke-width="1" opacity=".6"/>
  <polyline points="0,40 8,50 0,60" stroke-width="1"/><polyline points="160,40 152,50 160,60" stroke-width="1"/>
  <line x1="6" y1="16" x2="16" y2="6" stroke-width="1"/><line x1="144" y1="6" x2="154" y2="16" stroke-width="1"/>
  <line x1="6" y1="84" x2="16" y2="94" stroke-width="1"/><line x1="144" y1="94" x2="154" y2="84" stroke-width="1"/>
  <rect x="77" y="-3" width="6" height="6" transform="rotate(45 80 0)" fill="url(#__ID__)" stroke="none"/>
  <rect x="77" y="97" width="6" height="6" transform="rotate(45 80 100)" fill="url(#__ID__)" stroke="none"/></svg>`;
function halfPick(pos){
  return `<div class="pick"><span class="q">${T('q')}</span>
    <div class="pk"><button type="button" class="pa" data-a="pick" data-pos="${pos}" data-role="atk">${deco('dg-'+pos+'-atk','atk')}<span class="t">ATTACKER</span><span class="v">${T('atkV')}</span></button>
    <button type="button" class="pd" data-a="pick" data-pos="${pos}" data-role="def">${deco('dg-'+pos+'-def','def')}<span class="t">DEFENDER</span><span class="v">${T('defV')}</span></button></div>
    <span class="sub">${T('one')}</span>
    <span class="opts">${THEME==='minimal'?`<span class="seg mode" role="group" aria-label="${T('modeL')}"><button type="button" data-a="mode" data-m="light" aria-pressed="${MODE==='light'}">${ICON.sun} ${T('light')}</button><button type="button" data-a="mode" data-m="dark" aria-pressed="${MODE==='dark'}">${ICON.moon} ${T('dark')}</button></span>`:''}
    <span class="seg lang" role="group" aria-label="${T('langL')}"><button type="button" data-a="lang" data-l="en" aria-pressed="${LANG==='en'}" lang="en">EN</button><button type="button" data-a="lang" data-l="vi" aria-pressed="${LANG==='vi'}" lang="vi">VI</button></span></span></div>`;
}
const ICON={
  sun:`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
  moon:`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`,
  /* empty slot: dashed card outline */
  empty:`<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2.5 2.5" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/></svg>`,
  /* crossed swords */
  swords:`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="M5 14l4 4"/><path d="M7 17l-3 3"/><path d="M3 19l2 2"/></svg>`
};
const GLOW={atk:'rgba(255,96,40,.45)',def:'rgba(60,175,255,.42)'};
function gemBtn(disabled){
  return `<button type="button" class="sd" data-a="showdown" aria-label="Showdown" ${disabled?'disabled':''}><span class="ring"></span><span class="core"></span>
    <span class="txt"><span class="up">SHOWDOWN</span><i></i><span>SHOWDOWN</span></span><span class="ico">${ICON.swords}</span></button>`;
}
function render(){renderView();}
function renderView(){
  const app=document.getElementById('app');
  const dark=THEME==='minimal'&&MODE==='dark';
  app.classList.toggle('min',THEME==='minimal');
  app.classList.toggle('dark',dark);
  document.documentElement.classList.toggle('min-page',THEME==='minimal');
  document.documentElement.classList.toggle('dark-page',dark);
  document.documentElement.lang=LANG;
  if(S.phase==='pick'){
    /* theme switch, twice: right copy faces the bottom player, left copy is rotated for the top player */
    const tsw=`<span class="seg theme" role="group" aria-label="Theme"><button type="button" data-a="theme" data-t="legacy" aria-pressed="${THEME==='legacy'}">LEGACY</button><button type="button" data-a="theme" data-t="minimal" aria-pressed="${THEME==='minimal'}">MODERN</button></span>`;
    app.innerHTML=shell('top neutral',halfPick('top'))
      +`<div class="mid"><div class="l">${tsw}</div>${gemBtn(true)}<div class="r">${tsw}</div></div>`
      +shell('bottom neutral',halfPick('bottom'));
    save(); return;
  }
  if(S.phase==='dmg') clampDmg();
  const h=s=>S.phase==='dmg'?halfDmg(s):halfMight(s);
  /* same control set twice: left copy faces the bottom player, right copy is rotated 180° for the top player */
  const seg=confirmReset
    ?`<span class="seg"><button type="button" class="yes" data-a="resetYes">${T('clear')}</button><button type="button" class="no" data-a="resetNo">${T('cancel')}</button></span>`
    :`<span class="seg"><button type="button" data-a="phase" data-p="might" aria-pressed="${S.phase==='might'}">MIGHT</button><button type="button" data-a="phase" data-p="dmg" aria-pressed="${S.phase==='dmg'}">DMG</button><button type="button" class="rs" data-a="reset" aria-label="${T('newM')}" title="${T('newM')}">↺</button></span>`;
  const bot=S.bottom, top=OPP[bot];
  app.innerHTML=shell('top '+top,h(top))
    +`<div class="mid" style="--tg:${GLOW[top]};--bg2:${GLOW[bot]}">
       <div class="l">${seg}</div>${gemBtn(!(S.sides.atk.length+S.sides.def.length))}<div class="r">${seg}</div></div>`
    +shell('bottom '+bot,h(bot));
  save();
}

/* ---------- Resolve ---------- */
/* result emblem: double-line diamond inside a ring of quadrant arcs (arcs centred between the diamond tips) */
const EMBLEM=`<svg viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <g class="cir">
    <circle cx="100" cy="100" r="97" stroke="currentColor" stroke-width=".6" opacity=".45"/>
    <circle cx="100" cy="100" r="88" stroke="currentColor" stroke-width="1.6" stroke-dasharray="94 44.23" stroke-dashoffset="-22"/>
    <circle cx="100" cy="100" r="82" stroke="currentColor" stroke-width=".8" stroke-dasharray="74 54.8" stroke-dashoffset="-27.5" opacity=".6"/>
  </g>
  <polygon points="100,4 196,100 100,196 4,100" fill="rgba(5,8,15,.92)" stroke="currentColor" stroke-width="1.6"/>
  <g class="inner">
  <polygon points="100,13 187,100 100,187 13,100" stroke="currentColor" stroke-width=".8" opacity=".45"/>
  <polyline points="88,4 100,16 112,4" stroke="currentColor" stroke-width=".8"/><polyline points="88,196 100,184 112,196" stroke="currentColor" stroke-width=".8"/>
  <polyline points="4,88 16,100 4,112" stroke="currentColor" stroke-width=".8"/><polyline points="196,88 184,100 196,112" stroke="currentColor" stroke-width=".8"/>
  <rect x="97" y="1" width="6" height="6" transform="rotate(45 100 4)" fill="currentColor"/>
  <rect x="97" y="193" width="6" height="6" transform="rotate(45 100 196)" fill="currentColor"/>
  <rect x="1" y="97" width="6" height="6" transform="rotate(45 4 100)" fill="currentColor"/>
  <rect x="193" y="97" width="6" height="6" transform="rotate(45 196 100)" fill="currentColor"/>
  </g>
</svg>`;
function resolve(){
  if(resolving) return;
  if(S.phase!=='dmg'){autoAssign('atk');autoAssign('def');}
  else {
    clampDmg();
    /* each side assigns damage to the OTHER side's units: r = receiving side, OPP[r] = the side that must fix it */
    const list=[];
    for(const r of ['def','atk']) for(const msg of checks(r).w) list.push({side:SIDE[OPP[r]].toUpperCase(),msg});
    if(list.length){showErrs(list); return;}
  }
  const a=S.sides.atk.filter(u=>!isDead('atk',u)).length;
  const d=S.sides.def.filter(u=>!isDead('def',u)).length;
  const nA=S.sides.atk.length,nD=S.sides.def.length;
  let win, word;
  if(a&&!d) {win='atk';word='CONQUERED';}
  else if(!a&&!d){win='draw';word='DRAW';}
  else {win='def';word='DEFENDED';}
  const sub=`<b>Attacker</b> ${a}/${nA} ${T('liv')}<br><b>Defender</b> ${d}/${nD} ${T('liv')}`;
  /* winner's text faces the winner's half; a draw shows the word upright for both players */
  const faceTop=win!=='draw'&&S.bottom!==win;
  const inner=win==='draw'
    ?`<div class="res"><div class="ri"><span class="rw" style="transform:rotate(180deg)">DRAW</span><span class="rl"></span><span class="rw">DRAW</span></div></div>`
    :`<div class="res${faceTop?' flip':''}"><div class="ri"><span class="rw">${word}</span><span class="rl"></span><span class="rs">${sub}</span></div></div>`;
  const rings=[0,1,2].map(i=>`<span class="rg${i===1?' c':''}" style="--i:${i};--s:${14+i*3}"></span>`).join('');
  const app=document.getElementById('app');
  /* emblem starts at the size of the gem core (62px square → 88px diagonal) */
  const emW=Math.min(app.clientWidth*0.5,380);
  const s0=Math.min(1,88/(emW*0.96)).toFixed(3);
  const ov=document.createElement('div');
  ov.className='ov '+win;
  ov.setAttribute('role','status');
  ov.innerHTML=rings+`<div class="em" style="--s0:${s0}">${EMBLEM}<span class="orb"></span>${inner}</div><span class="skip">${T('skip')}</span>`;
  openType=null;
  app.classList.add('resolving','res-'+win);
  app.appendChild(ov);
  resolving=true;
  const done=()=>{
    if(!resolving) return; resolving=false; clearTimeout(t);
    app.classList.remove('resolving','res-atk','res-def','res-draw');
    S=blank(); confirmReset=false; render();
    /* pick screen slides back in from both edges instead of cutting */
    app.classList.add('enter');
    setTimeout(()=>app.classList.remove('enter'),1300);
  };
  const t=setTimeout(done,4100);
  ov.addEventListener('click',e=>{e.stopPropagation();done();});
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  if(resolving) return;
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a,s=b.dataset.s,d=+b.dataset.d||0;
  const sel=s&&S.sides[s]?S.sides[s].find(u=>u.id===S.sel[s]):null;
  if(a!=='typeopen') openType=null;
  if(a==='pick'){
    /* pick halves slide out to their edges, then the unit screen slides in */
    const role=b.dataset.role, bottom=b.dataset.pos==='bottom'?role:OPP[role];
    const app=document.getElementById('app');
    resolving=true; app.classList.add('leaving');
    setTimeout(()=>{
      S.bottom=bottom; S.phase='might'; app.classList.remove('leaving'); resolving=false;
      render(); app.classList.add('enter'); setTimeout(()=>app.classList.remove('enter'),1300);
    },400);
    return;
  }
  else if(a==='theme') setTheme(b.dataset.t);
  else if(a==='mode') setMode(b.dataset.m);
  else if(a==='lang') setLang(b.dataset.l);
  else if(a==='typeopen') openType=openType===s?null:s;
  else if(a==='typeset') S.type[s]=b.dataset.k;
  else if(a==='showdown'){resolve(); return;}
  else if(a==='sel') S.sel[s]=b.dataset.id;
  else if(a==='add'){const u=mkUnit(); S.sides[s].push(u); S.sel[s]=u.id;}
  else if(a==='del'&&sel){const L=S.sides[s],i=L.indexOf(sel); L.splice(i,1); S.sel[s]=(L[i]||L[i-1]||{}).id||null;}
  else if(a==='cbase'){const [,u]=find(b.dataset.id); u.base=Math.max(0,u.base+d); S.sel[s]=u.id;}
  else if(a==='tank'&&sel){sel.tank=!sel.tank; if(sel.tank) sel.backline=false;}  /* Tank and B-line are mutually exclusive: picking one clears the other */
  else if(a==='stun'&&sel) sel.stun=!sel.stun;
  else if(a==='back'&&sel){sel.backline=!sel.backline; if(sel.backline) sel.tank=false;}
  else if(a==='pre'&&sel) sel.pre=Math.max(0,preOf(sel)+d);
  else if(a==='mod'&&sel){const k=S.type[s]; sel.mods[k]=(sel.mods[k]||0)+d; if(!sel.mods[k]) delete sel.mods[k];}
  else if(a==='dmg'){const [,u]=find(b.dataset.id); S.dmg[s][u.id]=Math.max(0,dmgOf(s,u)+d);}
  else if(a==='auto') autoAssign(s);
  else if(a==='phase'){const p=b.dataset.p; if(p==='dmg'&&S.phase!=='dmg'){autoAssign('atk');autoAssign('def');} S.phase=p;}
  else if(a==='reset') confirmReset=true;
  else if(a==='resetNo') confirmReset=false;
  else if(a==='resetYes'){confirmReset=false; S=blank();}
  else return;
  render();
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();e.target.click();}
});
document.addEventListener('change',e=>{
  const s=e.target.dataset&&e.target.dataset.type; if(!s) return;
  S.type[s]=e.target.value; save();
});
render();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
