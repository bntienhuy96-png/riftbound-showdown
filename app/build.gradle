plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.riftshowdown'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.riftshowdown'
        minSdk 26          // adaptive launcher icon only, no legacy PNGs needed
        targetSdk 34
        // CI sets VERSION_CODE (= run number) so every build can be installed over the previous one;
        // local builds fall back to 1 (bump by hand)
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0'
    }

    // fixed debug key committed in the repo: every build (CI or local) is signed the same, so updates install over old ones
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
