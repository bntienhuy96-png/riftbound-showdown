name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # same wrapping step as build.ps1: web/showdown-calc.html -> full page in app assets
      - name: Bundle web app
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          {
            printf '%s\n' '<!doctype html>' '<html lang="en">' '<head>' '<meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' \
              '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>' \
              '</head>' '<body>'
            cat web/showdown-calc.html
            printf '\n%s\n%s\n' '</body>' '</html>'
          } > app/src/main/assets/index.html
      - name: Build APK
        run: gradle assembleDebug
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RiftboundShowdown.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RiftboundShowdown-apk
          path: RiftboundShowdown.apk
